name: Build

# Local-build check only. This workflow NEVER publishes:
# no GitHub Releases, no tags, no store uploads.
# It only builds the PyInstaller one-file binary and uploads it
# as a short-lived CI artifact for inspection.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6"

      - name: Build one-file binary (local only, no publish)
        run: pyinstaller --onefile run_game.py

      - name: Verify artifact
        run: |
          ls -la dist/

      - name: Upload build artifact (inspection only)
        uses: actions/upload-artifact@v4
        with:
          name: pypetigame-linux
          path: dist/
          retention-days: 7
