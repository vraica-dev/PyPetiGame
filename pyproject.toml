[project]
name = "pypetigame"
version = "1.0.0"
description = "Catch-the-treats arcade game built with pygame"
requires-python = ">=3.10"
dependencies = [
  "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]
packaging = [
  # Phase 5 distribution: PyInstaller one-file build (pypetigame.spec).
  # Install with: uv sync --group packaging && uv run pyinstaller pypetigame.spec
  "pyinstaller>=6",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
